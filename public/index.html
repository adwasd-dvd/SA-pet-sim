<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#24443b">
    <title>石器时代 Web 重构</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/f/favicon.ico">
    <link rel="stylesheet" href="/assets/app.css?v=56">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="回到首页">
          <img src="/f/logo.gif" alt="">
          <span>石器时代 Web 重构</span>
        </a>
        <div class="install-row">
          <span id="saveState" class="net-state">本地存档</span>
          <span id="netState" class="net-state">在线</span>
          <button id="installBtn" class="icon-btn" type="button" hidden title="安装">＋</button>
        </div>
      </header>

      <main>
        <section id="creator" class="creator">
          <div>
            <p class="eyebrow">单人冒险模式</p>
            <h1>创建人物，进入石器世界</h1>
            <p class="muted">出生在萨姆吉尔村，和 NPC 对话，探索地图出口，逐步接入原版任务、商店和存档。</p>
          </div>
          <form id="createForm" class="create-form">
            <label>
              人物名字
              <input id="playerName" maxlength="12" placeholder="新来的原始人">
            </label>
            <button type="submit">开始冒险</button>
          </form>
        </section>

        <section id="game" class="game" hidden>
          <section class="hud">
            <div>
              <p class="eyebrow">当前人物</p>
              <h1 id="playerTitle">--</h1>
              <p id="playerStats" class="muted">--</p>
            </div>
            <div class="hud-actions">
              <button id="guideBtn" type="button">AI 向导</button>
              <button id="newGameBtn" type="button">重新开始</button>
            </div>
          </section>

          <section class="world-grid">
            <article class="map-panel">
              <div class="client-field-menu client-field-menu-left" aria-label="原版左上指令">
                <span class="client-field-panel client-atlas-sprite" data-atlas-sprite="26236" aria-hidden="true"></span>
                <button class="client-field-sprite-btn menu" type="button" data-command-tab="settings" data-atlas-off="26101" data-atlas-on="26102" title="游戏设定"><span class="client-field-label">游戏设定</span></button>
                <button class="client-field-sprite-btn card" type="button" data-command-tab="card" data-atlas-off="26103" data-atlas-on="26104" title="交换名片"><span class="client-field-label">交换名片</span></button>
                <button class="client-field-sprite-btn party" type="button" data-command-tab="party" data-atlas-off="26105" data-atlas-on="26106" title="加入队伍"><span class="client-field-label">加入队伍</span></button>
                <button class="client-field-sprite-btn trade" type="button" data-command-tab="trade" data-atlas-off="26234" data-atlas-on="26235" title="进行交易"><span class="client-field-label">进行交易</span></button>
                <button class="client-field-sprite-btn channel" type="button" data-command-tab="channel" data-atlas-off="26237" data-atlas-on="26238" title="家族功能"><span class="client-field-label">家族功能</span></button>
              </div>
              <div class="client-field-menu client-field-menu-right" aria-label="原版右上动作">
                <span class="client-field-panel client-atlas-sprite" data-atlas-sprite="26260" aria-hidden="true"></span>
                <span class="client-field-right-back client-atlas-sprite" data-atlas-sprite="26121" aria-hidden="true"></span>
                <button class="client-field-sprite-btn join" type="button" data-command-tab="joinBattle" data-atlas-off="26111" data-atlas-on="26112" title="加入战斗"><span class="client-field-label">加入战斗</span></button>
                <button class="client-field-sprite-btn duel" type="button" data-command-tab="duel" data-atlas-off="26113" data-atlas-on="26114" title="决斗"><span class="client-field-label">决斗</span></button>
                <button class="client-field-sprite-btn help" type="button" data-command-tab="quests" data-atlas-off="26249" data-atlas-on="26248" title="任务查询"><span class="client-field-label">任务查询</span></button>
                <button class="client-field-sprite-btn action" type="button" data-command-tab="actions" data-atlas-off="26115" data-atlas-on="26116" title="人物的各种动作"><span class="client-field-label">人物的各种动作</span></button>
              </div>
              <div class="map-head">
                <div>
                  <p class="eyebrow">当前地图</p>
                  <h2 id="mapName">--</h2>
                  <p id="mapSummary" class="muted">--</p>
                </div>
                <div class="map-actions">
                  <div class="zoom-controls" aria-label="地图缩放">
                    <button id="mapZoomOut" type="button" title="缩小地图">-</button>
                    <button id="mapZoomReset" type="button" title="重置缩放"><span id="mapZoomValue">100%</span></button>
                    <button id="mapZoomIn" type="button" title="放大地图">+</button>
                  </div>
                  <button id="encounterBtn" type="button" hidden>野外遇敌</button>
                </div>
              </div>
              <div id="mapCanvas" class="map-canvas" aria-label="地图"></div>
              <div class="map-status-hud" aria-label="人物状态">
                <section class="map-status-chip">
                  <div>
                    <strong id="mapHudName">--</strong>
                    <span id="mapHudMeta">--</span>
                  </div>
                  <div class="status-bar" aria-label="人物 HP">
                    <i id="mapHudHpBar"></i>
                    <b id="mapHudHpText">--</b>
                  </div>
                </section>
                <section class="map-status-chip pet">
                  <div>
                    <strong id="mapHudPetName">--</strong>
                    <span id="mapHudPetMeta">--</span>
                  </div>
                  <div class="status-bar" aria-label="宠物 HP">
                    <i id="mapHudPetHpBar"></i>
                    <b id="mapHudPetHpText">--</b>
                  </div>
                </section>
                <p id="mapHudInventory">--</p>
              </div>
              <div class="map-command-dock" aria-label="游戏指令">
                <button type="button" data-command-tab="pets" title="宠物"><span>宠</span></button>
                <button type="button" data-command-tab="quests" title="任务"><span>任</span></button>
                <button type="button" data-command-tab="log" title="日志"><span>录</span></button>
                <button type="button" data-command-tab="save" title="存档"><span>存</span></button>
                <button type="button" data-command-tab="data" title="资料"><span>查</span></button>
                <button type="button" data-command-tab="ai" title="AI 向导"><span>导</span></button>
              </div>
              <div class="map-help">
                <span><b class="legend-dot player-dot"></b>你的位置</span>
                <span><b class="legend-dot npc-dot"></b>可对话 NPC</span>
                <span><b class="legend-dot exit-dot"></b>地图出口</span>
              </div>
              <section id="clientWindow" class="client-window" hidden>
                <div class="client-window-head">
                  <strong id="clientWindowTitle">ITEM</strong>
                  <button id="clientWindowClose" type="button" title="关闭">×</button>
                </div>
                <div id="clientWindowBody" class="client-window-body"></div>
              </section>
              <section id="dialogPanel" class="dialog-panel" hidden>
                <div class="dialog-head">
                  <div>
                    <p class="eyebrow">NPC 对话</p>
                    <h2 id="dialogNpcName">--</h2>
                    <p id="dialogSource" class="muted">--</p>
                  </div>
                  <button id="dialogCloseBtn" class="ghost-btn" type="button" aria-label="关闭">×</button>
                </div>
                <div class="dialog-body">
                  <div id="dialogMessages" class="dialog-messages"></div>
                  <div class="dialog-scroll" aria-hidden="false">
                    <button id="dialogScrollUpBtn" type="button" aria-label="向上卷动">▲</button>
                    <button id="dialogScrollDownBtn" type="button" aria-label="向下卷动">▼</button>
                  </div>
                </div>
                <div id="dialogSuggestions" class="dialog-suggestions"></div>
                <form id="dialogForm" class="dialog-form">
                  <input id="dialogInput" maxlength="160" autocomplete="off" placeholder="继续问任务、地图、交易、训练">
                  <button type="submit">确定</button>
                </form>
              </section>
              <section id="battlePanel" class="source-battle-panel" hidden>
                <div class="source-battle-stage">
                  <button id="battleEnemyTarget" class="battle-combatant enemy" type="button" data-battle-action="attack" aria-label="攻击目标">
                    <span id="battleEnemyImg" class="battle-sprite client-atlas-sprite" data-atlas-sprite="" aria-hidden="true"></span>
                    <strong id="battleEnemyName">--</strong>
                    <span id="battleEnemyStats">--</span>
                    <i><b id="battleEnemyHpBar"></b></i>
                  </button>
                  <div id="battleEnemyParty" class="battle-enemy-party" aria-label="敌方队列"></div>
                  <div class="battle-combatant party">
                    <span id="battlePetImg" class="battle-sprite client-atlas-sprite" data-atlas-sprite="" aria-hidden="true"></span>
                    <strong id="battlePetName">--</strong>
                    <span id="battlePetStats">--</span>
                    <i><b id="battlePetHpBar"></b></i>
                  </div>
                  <div class="battle-player-card">
                    <strong id="battlePlayerName">--</strong>
                    <span id="battlePlayerStats">--</span>
                  </div>
                </div>
                <div class="source-battle-command">
                  <div>
                    <strong id="battleTitle">BATTLE</strong>
                    <span id="battleSource">--</span>
                  </div>
                  <div id="battleCommandGrid" class="battle-command-grid"></div>
                </div>
                <div id="sourceBattleLog" class="source-battle-log" aria-live="polite"></div>
              </section>
              <div class="client-bottom-line" aria-label="原版频道与聊天栏">
                <span class="channel">一般频道</span>
                <span id="fieldMessage" class="field-message">--</span>
                <span class="mode">abc　玩家模式　0</span>
              </div>
            </article>

            <aside class="side-panel assist-panel" aria-label="底部辅助模块">
              <div id="assistTabs" class="assist-tabs" role="tablist">
                <button class="active" type="button" data-assist-tab="map" role="tab">地图</button>
                <button type="button" data-assist-tab="pets" role="tab">宠物</button>
                <button type="button" data-assist-tab="items" role="tab">道具</button>
                <button type="button" data-assist-tab="character" role="tab">人物</button>
                <button type="button" data-assist-tab="knowledge" role="tab">资料</button>
                <button type="button" data-assist-tab="debug" role="tab">Debug</button>
              </div>
              <div id="assistPanelBody" class="assist-panel-body"></div>
            </aside>
          </section>

          <section id="encounterPanel" class="encounter-panel" hidden>
            <div>
              <p class="eyebrow">遭遇</p>
              <h2 id="encounterName">--</h2>
              <p id="encounterStats" class="muted">--</p>
            </div>
            <img id="encounterImg" src="/f/logo.gif" alt="遇敌宠物">
            <div class="encounter-actions">
              <button id="attackBtn" type="button">攻击</button>
              <button id="captureBtn" type="button">捕获</button>
              <button id="skipEncounterBtn" type="button">放走</button>
            </div>
            <div id="battleLog" class="battle-log" aria-live="polite"></div>
          </section>

          <section class="tabs" aria-label="游戏信息">
            <div class="tab-list" role="tablist">
              <button class="tab active" type="button" data-tab="ai" role="tab">AI</button>
              <button class="tab" type="button" data-tab="quests" role="tab">任务</button>
              <button class="tab" type="button" data-tab="log" role="tab">日志</button>
              <button class="tab" type="button" data-tab="save" role="tab">存档</button>
            </div>

            <section id="petsTab" class="tab-panel" hidden>
              <div id="petList" class="pet-list"></div>
            </section>

            <section id="questsTab" class="tab-panel">
              <div id="questList" class="result-list"></div>
            </section>

            <section id="logTab" class="tab-panel">
              <div id="gameLog" class="log-list"></div>
            </section>

            <section id="saveTab" class="tab-panel">
              <div id="saveInfo" class="result-list"></div>
              <div class="save-actions">
                <button id="exportSaveBtn" type="button">导出 JSON</button>
                <button id="importSaveBtn" class="ghost-btn" type="button">导入 JSON</button>
              </div>
              <textarea id="saveText" class="save-text" rows="7" readonly></textarea>
              <textarea id="saveJsonText" class="save-text" rows="10" placeholder="这里可以粘贴 saac-pwa-v1 JSON 存档再导入"></textarea>
            </section>

            <section id="dataTab" class="tab-panel" hidden>
              <div class="search-row">
                <input id="dataQuery" type="search" placeholder="搜索地图、NPC、道具、宠物、遇敌数据">
                <button id="dataSearchBtn" type="button">搜索</button>
              </div>
              <div id="dataResults" class="result-list"></div>
            </section>

            <section id="aiTab" class="tab-panel active">
              <div class="ai-panel">
                <div id="aiStatusPanel" class="ai-status-panel" aria-label="角色状态"></div>
                <textarea id="aiPrompt" rows="4" placeholder="例如：帮我回血、带我去村子、帮我练宠，或者问下一步怎么走"></textarea>
                <button id="aiBtn" type="button">请求向导</button>
                <div id="aiResult" class="ai-result"></div>
              </div>
            </section>
          </section>
        </section>
      </main>
    </div>
    <script type="module" src="/assets/app.js?v=81"></script>
  </body>
</html>
